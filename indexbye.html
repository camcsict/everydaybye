<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hệ Thống Quản Lý Dữ Liệu</title>
    <style>
        :root {
            --font-size: 16px;
            --primary: #007bff;
            --primary-hover: #0056b3;
            --bg: #f4f7f6;
            --card-bg: #ffffff;
            --text: #333;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            font-size: var(--font-size);
            margin: 0;
            padding: 20px;
            transition: font-size 0.3s ease;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            background: var(--card-bg);
            padding: 20px 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
        }

        .header-controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #eee;
            padding-bottom: 15px;
            margin-bottom: 20px;
        }

        .font-controls button {
            background: #e9ecef;
            border: none;
            padding: 5px 12px;
            border-radius: 6px;
            cursor: pointer;
            margin-left: 5px;
            font-weight: bold;
            transition: 0.2s;
        }
        .font-controls button:hover { background: #d3d9df; }
        
        .font-small { font-size: 14px; }
        .font-medium { font-size: 18px; }
        .font-large { font-size: 22px; }

        .tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        .tab-btn {
            flex: 1;
            padding: 12px;
            border: none;
            background: #e9ecef;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            font-size: 1em;
            transition: 0.3s;
        }
        .tab-btn.active { background: var(--primary); color: white; }

        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; margin-bottom: 5px; font-weight: 600; }
        .form-group input, .form-group textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 1em;
            box-sizing: border-box;
        }
        .form-group textarea { resize: vertical; height: 100px; }

        .btn {
            background: var(--primary);
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 1em;
            font-weight: 600;
            width: 100%;
            transition: 0.3s;
        }
        .btn:hover { background: var(--primary-hover); }
        .btn:disabled { background: #999; cursor: not-allowed; }

        .section { display: none; }
        .section.active { display: block; }

        /* Style cho bộ lọc và nút View */
        .tools-area {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 20px;
        }
        .filter-group { display: flex; gap: 10px; flex-wrap: wrap; }
        .filter-group select {
            padding: 8px;
            border-radius: 6px;
            border: 1px solid #ddd;
            font-size: 1em;
        }
        .view-controls { display: flex; gap: 5px; }
        .view-btn {
            padding: 8px 12px;
            border: 1px solid #ddd;
            background: #fff;
            border-radius: 6px;
            cursor: pointer;
            transition: 0.2s;
            font-size: 0.9em;
        }
        .view-btn.active {
            background: var(--primary);
            color: white;
            border-color: var(--primary);
        }

        /* Container của dữ liệu: Mặc định là Grid 1 cột (List) */
        #dataList {
            display: grid;
            gap: 15px;
            grid-template-columns: 1fr;
        }
        /* Khi chuyển sang dạng Lưới (Grid) */
        #dataList.grid-view {
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
        }

        .data-card {
            background: #fdfdfd;
            border: 1px solid #eee;
            border-left: 4px solid var(--primary);
            padding: 15px;
            border-radius: 8px;
            height: 100%; 
            box-sizing: border-box;
        }
        .data-card h3 { margin: 0 0 10px 0; color: var(--primary); font-size: 1.1em;}
        .data-card p { margin: 5px 0; line-height: 1.5; }
        .data-date { font-size: 0.85em; color: #888; margin-bottom: 10px !important; }

        .loading { text-align: center; color: var(--primary); font-weight: bold; display: none; margin-top: 15px; }
    </style>
</head>
<body>

<div class="container">
    <div class="header-controls">
        <h2 style="margin: 0; color: var(--primary);">Quản Lý Dữ Liệu</h2>
        <div class="font-controls">
            <span>Kích cỡ:</span>
            <button class="font-small" onclick="setFontSize('14px')">A</button>
            <button class="font-medium" onclick="setFontSize('18px')">A</button>
            <button class="font-large" onclick="setFontSize('22px')">A</button>
        </div>
    </div>

    <div class="tabs">
        <button class="tab-btn active" onclick="switchTab('input')">📝 Nhập dữ liệu</button>
        <button class="tab-btn" onclick="switchTab('view')">🗂️ Xem dữ liệu</button>
    </div>

    <!-- PHẦN NHẬP DỮ LIỆU -->
    <div id="section-input" class="section active">
        <form id="dataForm">
            <div class="form-group">
                <label>Tiêu đề *</label>
                <input type="text" id="title" required placeholder="Nhập tiêu đề...">
            </div>
            <div class="form-group">
                <label>Nội dung *</label>
                <textarea id="content" required placeholder="Nhập nội dung..."></textarea>
            </div>
            <div class="form-group">
                <label>Đường dẫn (URL)</label>
                <input type="text" id="url" placeholder="Nhập đường dẫn (tùy ý)...">
            </div>
            <div class="form-group">
                <label>Ghi chú</label>
                <input type="text" id="notes" placeholder="Ghi chú thêm...">
            </div>
            <button type="submit" class="btn" id="submitBtn">Lưu</button>
        </form>
    </div>

    <!-- PHẦN XEM DỮ LIỆU -->
    <div id="section-view" class="section">
        <div id="authArea">
            <div class="form-group">
                <label>Nhập mã bảo mật để xem dữ liệu</label>
                <input type="password" id="passcode" placeholder="Nhập mã (Mặc định: 123456)...">
            </div>
            <button class="btn" id="authBtn" onclick="loadData()">Xác nhận</button>
            <p class="loading" id="loadingText">Đang tải dữ liệu... (0 giây)</p>
        </div>

        <div id="dataArea" style="display: none;">
            <div class="tools-area">
                <div class="filter-group">
                    <select id="viewFilter" onchange="renderData()">
                        <option value="all">Tất cả dữ liệu</option>
                        <option value="5">5 tin gần nhất</option>
                        <option value="10">10 tin gần nhất</option>
                        <option value="20">20 tin gần nhất</option>
                        <option value="month">Lọc theo tháng</option>
                    </select>
                    <select id="monthFilter" style="display:none;" onchange="renderData()"></select>
                </div>
                <!-- Nút chuyển đổi View List/Grid -->
                <div class="view-controls">
                    <button id="btnListView" class="view-btn active" onclick="setViewMode('list')">☰ Danh sách</button>
                    <button id="btnGridView" class="view-btn" onclick="setViewMode('grid')">⊞ Lưới</button>
                </div>
            </div>
            <div id="dataList"></div>
        </div>
    </div>
</div>

<script>
    // BẮT BUỘC: DÁN LINK BẠN COPY Ở BƯỚC 1 VÀO ĐÂY (Giữ nguyên 2 dấu nháy đơn)
    const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbwHtX1Ve13h6P1JZFNaRY-v8q4Gu8bop6oLGjY4AyLmZtKZlysWqTTZAKQnoI9qf_8vlw/exec';
    
    let allData = [];
    let timerInterval; // Biến lưu trữ bộ đếm thời gian

    function setFontSize(size) {
        document.documentElement.style.setProperty('--font-size', size);
    }

    function switchTab(tab) {
        document.querySelectorAll('.section').forEach(el => el.classList.remove('active'));
        document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
        document.getElementById('section-' + tab).classList.add('active');
        event.currentTarget.classList.add('active');
    }

    function setViewMode(mode) {
        const list = document.getElementById('dataList');
        const btnList = document.getElementById('btnListView');
        const btnGrid = document.getElementById('btnGridView');

        if(mode === 'grid') {
            list.classList.add('grid-view');
            btnGrid.classList.add('active');
            btnList.classList.remove('active');
        } else {
            list.classList.remove('grid-view');
            btnList.classList.add('active');
            btnGrid.classList.remove('active');
        }
    }

    document.getElementById('dataForm').addEventListener('submit', function(e) {
        e.preventDefault();
        
        if(SCRIPT_URL === 'DÁN_LINK_WEB_APP_CỦA_BẠN_VÀO_ĐÂY') {
            alert('Lỗi: Bạn chưa thay thế SCRIPT_URL trong code HTML!');
            return;
        }

        const btn = document.getElementById('submitBtn');
        btn.innerText = 'Đang lưu...';
        btn.disabled = true;

        const data = new URLSearchParams({
            action: 'addData',
            title: document.getElementById('title').value,
            content: document.getElementById('content').value,
            url: document.getElementById('url').value,
            notes: document.getElementById('notes').value
        });

        fetch(SCRIPT_URL, { method: 'POST', body: data })
        .then(res => res.json())
        .then(response => {
            alert('Đã lưu dữ liệu thành công!');
            document.getElementById('dataForm').reset();
        })
        .catch(err => { alert('Lỗi kết nối. Vui lòng kiểm tra lại Link Web App.'); })
        .finally(() => {
            btn.innerText = 'Lưu Dữ Liệu';
            btn.disabled = false;
        });
    });

    function loadData() {
        if(SCRIPT_URL === 'DÁN_LINK_WEB_APP_CỦA_BẠN_VÀO_ĐÂY') {
            alert('Lỗi: Bạn chưa thay thế SCRIPT_URL trong code HTML!');
            return;
        }

        const passcode = document.getElementById('passcode').value;
        if(!passcode) return alert('Vui lòng nhập mã bảo mật!');

        const authBtn = document.getElementById('authBtn');
        const loadingText = document.getElementById('loadingText');
        
        // Disable nút bấm và bắt đầu đếm giờ
        authBtn.disabled = true;
        authBtn.innerText = 'Đang xử lý...';
        loadingText.style.display = 'block';
        
        let seconds = 0;
        loadingText.innerText = `Đang tải dữ liệu... (${seconds} giây)`;
        
        // Tăng giây mỗi 1000ms (1 giây)
        timerInterval = setInterval(() => {
            seconds++;
            loadingText.innerText = `Đang tải dữ liệu... (${seconds} giây)`;
        }, 1000);

        fetch(SCRIPT_URL + '?action=getData&passcode=' + encodeURIComponent(passcode))
        .then(res => res.json())
        .then(res => {
            if(res.status === 'success') {
                allData = res.data; 
                document.getElementById('authArea').style.display = 'none';
                document.getElementById('dataArea').style.display = 'block';
                populateMonthDropdown();
                renderData();
            } else {
                alert(res.message);
            }
        })
        .catch(err => { alert('Lỗi tải dữ liệu. Vui lòng kiểm tra lại Link Web App.'); })
        .finally(() => { 
            // Dừng bộ đếm và reset giao diện
            clearInterval(timerInterval);
            loadingText.style.display = 'none'; 
            authBtn.disabled = false;
            authBtn.innerText = 'Xác nhận';
        });
    }

    function populateMonthDropdown() {
        const monthSelect = document.getElementById('monthFilter');
        monthSelect.innerHTML = '';
        const months = new Set();
        
        allData.forEach(item => {
            let dateStr = item.date;
            if (dateStr.match(/^\d{4}-\d{2}-\d{2}/)) {
                let parts = dateStr.split(' ')[0].split('-');
                months.add(`${parts[0]}-${parts[1]}`); 
            } 
            else if (dateStr.match(/^\d{2}\/\d{2}\/\d{4}/)) {
                let parts = dateStr.split(' ')[0].split('/');
                months.add(`${parts[2]}-${parts[1]}`); 
            }
        });

        Array.from(months).sort().reverse().forEach(m => {
            let opt = document.createElement('option');
            opt.value = m; 
            let parts = m.split('-');
            opt.innerText = `Tháng ${parts[1]}/${parts[0]}`;
            monthSelect.appendChild(opt);
        });
    }

    function renderData() {
        const filterType = document.getElementById('viewFilter').value;
        const monthFilter = document.getElementById('monthFilter');
        const listDiv = document.getElementById('dataList');
        
        monthFilter.style.display = (filterType === 'month') ? 'block' : 'none';
        
        let displayData = [...allData].reverse(); 

        if (filterType === '5') displayData = displayData.slice(0, 5);
        else if (filterType === '10') displayData = displayData.slice(0, 10);
        else if (filterType === '20') displayData = displayData.slice(0, 20);
        else if (filterType === 'month') {
            const selectedMonth = monthFilter.value; 
            displayData = displayData.filter(item => {
                let isNewFormat = item.date.startsWith(selectedMonth); 
                
                let parts = selectedMonth.split('-');
                let oldFormatStr = `${parts[1]}/${parts[0]}`; 
                let isOldFormat = item.date.includes(oldFormatStr); 
                
                return isNewFormat || isOldFormat;
            });
        }

        listDiv.innerHTML = '';
        if(displayData.length === 0) {
            listDiv.innerHTML = '<p style="text-align:center; color:#888;">Không có dữ liệu phù hợp.</p>';
            return;
        }

        displayData.forEach(item => {
            listDiv.innerHTML += `
                <div class="data-card">
                    <p class="data-date">🕒 ${item.date}</p>
                    <h3>${item.title}</h3>
                    <p><strong>Nội dung:</strong> <br>${item.content.replace(/\n/g, '<br>')}</p>
                    ${item.url ? `<p><strong>Đường dẫn:</strong> <a href="${item.url}" target="_blank" style="color:var(--primary); text-decoration:none;">Nhấp vào đây 🔗</a></p>` : ''}
                    ${item.notes ? `<p><strong>Ghi chú:</strong> ${item.notes}</p>` : ''}
                </div>
            `;
        });
    }
</script>
</body>
</html>
