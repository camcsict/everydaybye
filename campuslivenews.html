<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CS ICT Live News Hub</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');
        body { 
            font-family: 'Plus Jakarta Sans', sans-serif; 
            background-color: #f8fafc;
            color: #0f172a;
            transition: background-color 1s ease;
        }
        
        .marquee-container { display: flex; overflow: hidden; white-space: nowrap; width: 100%; align-items: center; }
        .marquee-content { display: inline-block; padding-left: 100%; animation: marquee 25s linear infinite; }
        @keyframes marquee { 0% { transform: translate(0, 0); } 100% { transform: translate(-100%, 0); } }

        .card-modern {
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -1px rgba(0, 0, 0, 0.03);
        }
        .card-modern:hover {
            transform: translateY(-5px);
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
        }

        .nav-glass {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
        }
        
        .dropdown-enter { animation: dropIn 0.2s cubic-bezier(0, 0, 0.2, 1) forwards; transform-origin: top; }
        @keyframes dropIn { from { opacity: 0; transform: scaleY(0.95); } to { opacity: 1; transform: scaleY(1); } }

        .custom-scrollbar::-webkit-scrollbar { width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: #f1f5f9; border-radius: 8px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 8px; }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: #94a3b8; }

        /* HIỆU ỨNG THỜI TIẾT MỚI */
        @keyframes rainFall {
            0% { transform: translateY(-10vh); opacity: 0.8; }
            100% { transform: translateY(110vh); opacity: 0; }
        }
        @keyframes cloudMove {
            0% { transform: translateX(-20vw); opacity: 0; }
            10% { opacity: 0.8; }
            90% { opacity: 0.8; }
            100% { transform: translateX(120vw); opacity: 0; }
        }
        
        /* Hiệu ứng Sấm sét */
        .lightning-flash {
            position: fixed; inset: 0; background: white; z-index: 9999;
            pointer-events: none; opacity: 0; animation: flashAnim 0.5s ease-out forwards;
        }
        @keyframes flashAnim {
            0% { opacity: 0.9; } 30% { opacity: 0; } 50% { opacity: 0.6; } 100% { opacity: 0; }
        }

        /* Hiệu ứng Nắng chói chang (10s) */
        .sun-glare-effect {
            position: fixed; inset: 0; z-index: 9999; pointer-events: none; opacity: 0;
            background: radial-gradient(circle, rgba(255,255,255,0.9) 0%, rgba(253,224,71,0.4) 100%);
            animation: glareAnim 2.5s ease-in-out forwards;
        }
        @keyframes glareAnim {
            0% { opacity: 0; } 50% { opacity: 0.65; } 100% { opacity: 0; }
        }

        /* Hiệu ứng Sương mây phủ mờ (10s) */
        .cloud-fog-effect {
            position: fixed; inset: 0; z-index: 9999; pointer-events: none; opacity: 0;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.8), transparent);
            animation: fogAnim 4s linear forwards;
        }
        @keyframes fogAnim {
            0% { opacity: 0; transform: translateX(-100%); }
            50% { opacity: 1; }
            100% { opacity: 0; transform: translateX(100%); }
        }

        /* Overlay Nắng Thường Trực (Điều khiển qua Slider) */
        #sunOverlay {
            position: fixed; inset: 0; background: #fef08a; mix-blend-mode: overlay;
            opacity: 0; pointer-events: none; z-index: 25; transition: opacity 0.3s;
        }
    </style>
</head>
<body class="antialiased relative">

    <div id="sunOverlay"></div>
    <div id="weatherEffectsContainer" class="fixed inset-0 pointer-events-none z-[30] overflow-hidden"></div>

    <!-- ============================================== -->
    <!-- SLIDER: MƯA -->
    <!-- ============================================== -->
    <div id="rainSliderWrapper" class="hidden fixed left-3 sm:left-6 top-1/2 -translate-y-1/2 z-[45] flex flex-col items-center bg-white/80 backdrop-blur-md p-3 rounded-full shadow-lg border border-slate-100 hover:bg-white transition-colors duration-300 group">
        <i class="fas fa-cloud-showers-heavy text-slate-500 mb-5 text-lg" title="Heavy Rain"></i>
        <div class="relative h-40 w-6">
            <input type="range" id="rainIntensitySlider" min="1" max="10" value="3" oninput="updateRainIntensity()" 
                   class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-40 h-2 bg-slate-200 rounded-full appearance-none cursor-pointer -rotate-90 accent-slate-600 focus:outline-none">
        </div>
        <i class="fas fa-tint text-slate-500 mt-5 text-lg" title="Light Rain"></i>
    </div>

    <!-- ============================================== -->
    <!-- SLIDER: NẮNG -->
    <!-- ============================================== -->
    <div id="sunSliderWrapper" class="hidden fixed left-3 sm:left-6 top-1/2 -translate-y-1/2 z-[45] flex flex-col items-center bg-white/80 backdrop-blur-md p-3 rounded-full shadow-lg border border-yellow-100 hover:bg-white transition-colors duration-300 group">
        <i class="fas fa-sun text-yellow-500 mb-5 text-lg" title="High Intensity"></i>
        <div class="relative h-40 w-6">
            <input type="range" id="sunIntensitySlider" min="1" max="10" value="5" oninput="updateSunIntensity()" 
                   class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-40 h-2 bg-yellow-100 rounded-full appearance-none cursor-pointer -rotate-90 accent-yellow-500 focus:outline-none">
        </div>
        <i class="fas fa-lightbulb text-yellow-500 mt-5 text-lg" title="Low Intensity"></i>
    </div>

    <!-- ============================================== -->
    <!-- SLIDER: MÂY BAY -->
    <!-- ============================================== -->
    <div id="cloudSliderWrapper" class="hidden fixed left-3 sm:left-6 top-1/2 -translate-y-1/2 z-[45] flex flex-col items-center bg-white/80 backdrop-blur-md p-3 rounded-full shadow-lg border border-sky-100 hover:bg-white transition-colors duration-300 group">
        <i class="fas fa-wind text-sky-500 mb-5 text-lg" title="Fast Clouds"></i>
        <div class="relative h-40 w-6">
            <input type="range" id="cloudSpeedSlider" min="1" max="10" value="5" oninput="updateCloudSpeed()" 
                   class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-40 h-2 bg-sky-100 rounded-full appearance-none cursor-pointer -rotate-90 accent-sky-500 focus:outline-none">
        </div>
        <i class="fas fa-cloud text-sky-500 mt-5 text-lg" title="Slow Clouds"></i>
    </div>

    <!-- ============================================== -->
    <!-- POPUP: HELLO OCTOBER (Màu Xanh Lá Đậm - Green) -->
    <!-- ============================================== -->
    <div id="popupWeather" class="fixed inset-0 bg-slate-900/50 backdrop-blur-md z-[210] flex items-center justify-center p-4">
        <div class="bg-white rounded-[2rem] p-8 max-w-sm w-full shadow-2xl text-center transform transition-all border-b-4 border-green-600 relative overflow-hidden">
            <div class="absolute top-0 left-0 w-full h-32 bg-gradient-to-br from-green-600 to-green-400 -z-10" id="popupHeader"></div>
            
            <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTdFm3mCr0ExidcIosX-dkYV4d10VqPFRj65EGT8ikXHQ&s=10" alt="Thumbnail" class="w-28 h-28 object-cover rounded-full mx-auto mt-4 mb-4 shadow-xl border-4 border-white">
            
            <h3 class="text-3xl font-black text-slate-900 mb-2">👻 Hello October 👋</h3>
            <p class="text-xl font-bold text-slate-500 mb-6">What weather is today?</p>
            
            <div class="flex justify-center items-center gap-6 mb-2">
                <button onclick="setWeather('rain')" class="text-4xl hover:scale-125 hover:-translate-y-2 transition-transform duration-300 drop-shadow-md">🌧️</button>
                <button onclick="setWeather('sunny')" class="text-4xl hover:scale-125 hover:-translate-y-2 transition-transform duration-300 drop-shadow-md">☀️</button>
                <button onclick="setWeather('cloudy')" class="text-4xl hover:scale-125 hover:-translate-y-2 transition-transform duration-300 drop-shadow-md">🌤️</button>
            </div>
        </div>
    </div>

    <!-- GLOBAL LOADING OVERLAY -->
    <div id="globalLoader" class="fixed inset-0 bg-slate-900/40 backdrop-blur-sm z-[100] flex flex-col items-center justify-center hidden">
        <div class="bg-white px-8 py-6 rounded-3xl shadow-2xl flex flex-col items-center max-w-sm w-[90%] text-center">
            <div class="relative w-16 h-16 mb-4">
                <div class="absolute inset-0 rounded-full border-4 border-slate-100"></div>
                <div class="absolute inset-0 rounded-full border-4 border-green-600 border-t-transparent animate-spin" id="spinnerUI"></div>
            </div>
            <h3 id="loaderText" class="text-lg font-bold text-slate-800 mb-1">Processing...</h3>
            <div class="text-green-600 font-extrabold text-2xl flex items-center justify-center" id="timerUI">
                <i class="far fa-clock mr-2 text-xl"></i>
                <span id="loaderTimer">0</span><span class="text-lg ml-1">s</span>
            </div>
        </div>
    </div>

    <!-- Ticker Bar -->
    <div class="bg-green-600 text-white text-sm py-2 px-3 sm:px-4 shadow-sm flex items-center z-50 relative theme-transition">
        <span class="bg-green-800 px-3 py-1 rounded-full text-xs font-bold uppercase tracking-wide mr-3 flex items-center shrink-0 theme-transition-dark">
            <i class="fas fa-bolt mr-1.5 text-white"></i> UPDATE
        </span>
        <div class="marquee-container w-full font-medium text-green-50 text-sm sm:text-base">
            <span class="marquee-content" id="tickerText">Initializing system...</span>
        </div>
    </div>

    <!-- Header / Navigation -->
    <nav class="nav-glass sticky top-0 z-40 border-b border-slate-200">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between h-20 items-center">
                <div class="flex items-center cursor-pointer group" onclick="selectClassOption('General', '🌐 School Wide')">
                    <div class="w-10 h-10 sm:w-12 sm:h-12 rounded-xl sm:rounded-2xl bg-green-600 flex items-center justify-center text-white shadow-md group-hover:scale-105 transition theme-transition">
                        <i class="fas fa-layer-group text-xl sm:text-2xl"></i>
                    </div>
                    <div class="ml-3 sm:ml-4">
                        <span class="font-extrabold text-xl sm:text-2xl tracking-tight text-slate-900">Tech<span class="text-green-600 theme-transition-text">News</span></span>
                        <p class="text-[10px] sm:text-xs text-slate-500 font-bold uppercase tracking-widest hidden sm:block">ICT Information Portal</p>
                    </div>
                </div>
                
                <div class="flex space-x-2 sm:space-x-4 items-center">
                    <div class="relative" id="customDropdown">
                        <button onclick="toggleDropdown(event)" class="bg-slate-100 hover:bg-slate-200 text-slate-700 text-sm sm:text-base rounded-xl py-2.5 px-4 font-bold transition flex items-center justify-center gap-2 w-max min-w-[140px]">
                            <span id="dropdownSelected" class="pointer-events-none whitespace-nowrap">🌐 School Wide</span>
                            <i class="fas fa-chevron-down text-xs pointer-events-none text-slate-400 shrink-0"></i>
                        </button>
                        <div id="dropdownMenu" class="hidden absolute right-0 mt-2 w-[220px] bg-white rounded-2xl shadow-xl border border-slate-100 overflow-hidden z-50 dropdown-enter py-1">
                        </div>
                    </div>
                    <button onclick="showView('submit')" class="bg-green-600 hover:bg-green-700 text-white px-4 sm:px-6 py-2.5 rounded-xl font-bold shadow-md transition duration-300 flex items-center text-sm sm:text-base whitespace-nowrap theme-transition">
                        #ShareYourStory
                    </button>
                </div>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 sm:py-10">
        
        <div id="newsView" class="hidden">
            <!-- HOT NEWS -->
            <section id="hotNewsSection" class="mb-14 hidden">
                <div class="flex items-center space-x-3 mb-6">
                    <div class="w-10 h-10 rounded-full bg-rose-100 text-rose-600 flex items-center justify-center text-xl">
                        <i class="fas fa-fire-alt"></i>
                    </div>
                    <h2 class="text-2xl sm:text-3xl font-extrabold text-slate-900">Trending Now</h2>
                </div>
                <div id="hotNewsContainer" class="grid grid-cols-1 lg:grid-cols-2 gap-6 sm:gap-8"></div>
            </section>

            <!-- REGULAR FEED -->
            <section>
                <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center mb-6 sm:mb-8 space-y-3 sm:space-y-0">
                    <h2 id="sectionTitle" class="text-2xl sm:text-3xl font-extrabold text-slate-900 flex items-center">
                        <i class="fas fa-stream mr-3 text-slate-400"></i> Recent Feed
                    </h2>
                    
                    <div class="flex flex-wrap items-center gap-3">
                        <div class="bg-slate-200/60 p-1 rounded-xl flex items-center shadow-inner">
                            <button onclick="setViewMode('grid')" id="btnGrid" class="px-3.5 py-1.5 rounded-lg bg-white text-green-600 shadow-sm font-medium transition theme-transition-text">
                                <i class="fas fa-th-large"></i>
                            </button>
                            <button onclick="setViewMode('list')" id="btnList" class="px-3.5 py-1.5 rounded-lg text-slate-500 hover:text-slate-800 hover:bg-slate-200/50 font-medium transition">
                                <i class="fas fa-list"></i>
                            </button>
                        </div>
                        <span id="currentScopeBadge" class="bg-green-100 text-green-700 text-sm font-bold px-4 py-1.5 rounded-full theme-badge">School Wide</span>
                        <button id="logoutClassBtn" onclick="logoutClass()" class="hidden bg-rose-100 text-rose-600 hover:bg-rose-200 text-sm font-bold px-4 py-1.5 rounded-full transition flex items-center">
                            <i class="fas fa-sign-out-alt mr-1.5"></i> Log out
                        </button>
                    </div>
                </div>
                <div id="newsContainer" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6 sm:gap-8"></div>
                <div id="noNewsMsg" class="hidden flex flex-col items-center justify-center py-20 text-slate-400 bg-white rounded-3xl border border-slate-100 shadow-sm mt-4">
                    <div class="w-20 h-20 bg-slate-50 rounded-full flex items-center justify-center mb-4">
                        <i class="fas fa-inbox text-3xl"></i>
                    </div>
                    <p class="font-bold text-lg">No stories published yet.</p>
                </div>
            </section>

            <br><br>

            <!-- IGCSE NEWS SECTION -->
            <section id="igsceNewsSection" class="mb-14 hidden">
                <div class="flex items-center space-x-3 mb-6">
                    <div class="w-10 h-10 rounded-full bg-purple-100 text-purple-600 flex items-center justify-center text-xl">
                        <i class="fas fa-graduation-cap"></i>
                    </div>
                    <h2 class="text-2xl sm:text-3xl font-extrabold text-slate-900">IGCSE ICT</h2>
                </div>
                <div id="igsceNewsContainer" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6 sm:gap-8"></div>
            </section>
        </div>

        <!-- SUBMIT FORM VIEW -->
        <div id="submitView" class="hidden max-w-2xl mx-auto">
            <div class="bg-white p-6 sm:p-10 rounded-3xl shadow-sm border border-slate-100 card-modern">
                <div class="w-14 h-14 bg-green-100 text-green-600 rounded-2xl flex items-center justify-center text-2xl mb-6 shadow-inner theme-badge">✨</div>
                <h2 class="text-2xl sm:text-3xl font-extrabold text-slate-900 mb-2">Share Your Story</h2>
                <form id="newsForm" onsubmit="handlePreview(event)">
                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-6 mb-6">
                        <div>
                            <label class="block text-sm font-bold text-slate-700 mb-2">Student Name</label>
                            <input type="text" id="studentName" required class="w-full px-5 py-3.5 rounded-xl bg-slate-50 border border-slate-200 outline-none transition font-medium theme-ring">
                        </div>
                        <div>
                            <label class="block text-sm font-bold text-slate-700 mb-2">Your Class</label>
                            <select id="studentClass" required class="w-full px-5 py-3.5 rounded-xl bg-slate-50 border border-slate-200 outline-none transition font-medium theme-ring">
                                <option value="General">General / School Wide</option>
                            </select>
                        </div>
                    </div>
                    <div class="mb-8">
                        <label class="block text-sm font-bold text-slate-700 mb-2">Story Details</label>
                        <textarea id="newsContent" required rows="5" class="w-full px-5 py-4 rounded-xl bg-slate-50 border border-slate-200 outline-none transition font-medium theme-ring"></textarea>
                    </div>
                    <button type="submit" class="w-full bg-green-600 hover:bg-green-700 text-white font-bold py-4 rounded-xl shadow-lg transition text-lg flex items-center justify-center theme-transition">
                        <span class="mr-2">✨</span> Preview Story
                    </button>
                </form>
            </div>
        </div>
    </main>

    <!-- PASSWORD MODAL -->
    <div id="passwordModal" class="hidden fixed inset-0 bg-slate-900/50 backdrop-blur-md z-50 flex items-center justify-center p-4">
        <div class="bg-white rounded-3xl p-8 max-w-md w-full shadow-2xl text-center transform transition-all border-t-4 border-green-600 theme-border-t">
            <h3 class="text-2xl font-extrabold text-slate-900 mb-2">Exclusive Space</h3>
            <p class="text-sm font-medium text-slate-500 mb-8">Unlock <span id="targetClassName" class="font-bold text-green-600 theme-transition-text"></span>.</p>
            <div class="relative mb-4">
                <input type="password" id="classPassInput" class="w-full px-5 py-4 rounded-xl bg-slate-50 border border-slate-200 text-center text-xl tracking-widest font-bold pr-12 theme-ring" placeholder="••••••••">
                <button type="button" class="absolute inset-y-0 right-4 flex items-center text-slate-400 focus:outline-none theme-hover-text" onclick="togglePassVisibility()">
                    <i class="fas fa-eye text-lg" id="eyeIcon"></i>
                </button>
            </div>
            <p id="passError" class="text-sm text-rose-500 font-bold mb-6 hidden bg-rose-50 py-2 rounded-lg"><i class="fas fa-exclamation-circle mr-1"></i> Incorrect passcode.</p>
            <div class="flex space-x-4 mt-2">
                <button onclick="cancelPasswordModal()" class="flex-1 py-3.5 rounded-xl font-bold bg-slate-100 text-slate-600 transition">Cancel</button>
                <button onclick="submitPassword()" class="flex-1 py-3.5 rounded-xl font-bold bg-green-600 text-white transition theme-transition">Launch</button>
            </div>
        </div>
    </div>

    <!-- PREVIEW MODAL -->
    <div id="previewModal" class="hidden fixed inset-0 bg-slate-900/50 backdrop-blur-md z-50 flex items-center justify-center p-0 sm:p-4">
        <div id="previewBox" class="bg-white rounded-none sm:rounded-3xl p-6 sm:p-8 max-w-lg w-full h-full sm:h-auto shadow-2xl flex flex-col max-h-screen sm:max-h-[95vh] transition-all duration-300">
            <div class="flex justify-between items-center mb-5 shrink-0">
                <h3 class="text-2xl font-extrabold text-slate-900 flex items-center"><span class="mr-2">✨</span> Review</h3>
                <button type="button" onclick="toggleFullScreenPreview()" id="fullScreenBtn" class="w-10 h-10 flex items-center justify-center rounded-xl bg-slate-100 text-slate-500 transition theme-hover-text">
                    <i class="fas fa-expand text-lg"></i>
                </button>
            </div>
            <div id="previewContentArea" class="bg-slate-50 p-5 rounded-2xl mb-6 border border-slate-200 max-h-[45vh] overflow-y-auto custom-scrollbar">
                <div class="flex items-center mb-3">
                    <div class="w-10 h-10 rounded-full bg-green-100 text-green-600 flex items-center justify-center font-bold text-lg mr-3 theme-badge" id="prevAvatar">A</div>
                    <div><p class="font-bold text-slate-900 text-sm" id="prevName"></p></div>
                </div>
                <p class="text-slate-700 font-medium leading-relaxed whitespace-pre-wrap break-words" id="prevContent"></p>
            </div>
            <div class="shrink-0 mt-auto">
                <label class="flex items-start space-x-3 cursor-pointer mb-6 bg-slate-50 p-4 rounded-xl border border-slate-100 transition theme-badge-light">
                    <input type="checkbox" id="confirmRules" class="mt-0.5 w-5 h-5 text-green-600 bg-white border-slate-300 rounded shrink-0 theme-ring">
                    <span class="text-sm font-semibold text-slate-700">I confirm this information is appropriate.</span>
                </label>
                <div class="flex space-x-4">
                    <button onclick="closePreview()" class="flex-1 py-3.5 rounded-xl font-bold bg-slate-100 text-slate-600 transition">Edit</button>
                    <button onclick="submitData()" id="finalSubmitBtn" class="flex-1 py-3.5 rounded-xl font-bold bg-green-600 text-white opacity-50 cursor-not-allowed transition theme-transition" disabled>Submit</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        // GOOGLE APP SCRIPT URL:
        const API_URL = 'https://script.google.com/macros/s/AKfycbwb29PPp_9xdPl_0gMQhdZ8Q-NgS3WwBwVvv80oXdouPonR-5wGFi0fvDagRg0OUwn-tQ/exec'; 
        
        let currentTheme = 'green';
        let effectInterval = null;

        // Cấu hình UI Dự Báo Thời Tiết cho Khung Tin Tức
        let weatherCardIcon = '';
        let weatherRecommendation = '';
        let weatherCardBgClass = 'bg-white border-slate-100';

        // ==========================================
        // WEATHER ENGINE LOGIC
        // ==========================================
        function setWeather(type) {
            document.getElementById('popupWeather').classList.add('hidden');
            const weatherContainer = document.getElementById('weatherEffectsContainer');
            
            // Ẩn tất cả slider & Xóa hiệu ứng cũ
            document.getElementById('rainSliderWrapper').classList.add('hidden');
            document.getElementById('sunSliderWrapper').classList.add('hidden');
            document.getElementById('cloudSliderWrapper').classList.add('hidden');
            document.getElementById('sunOverlay').style.opacity = '0';
            weatherContainer.innerHTML = ''; 
            clearInterval(effectInterval);

            let newThemeColor = 'green';

            if (type === 'rain') {
                newThemeColor = 'slate';
                document.body.style.backgroundColor = '#94a3b8'; // Xám trời
                
                weatherCardIcon = '☔';
                weatherRecommendation = 'Bring Umbrella';
                weatherCardBgClass = 'bg-slate-100/95 border-slate-300';
                
                document.getElementById('rainSliderWrapper').classList.remove('hidden');
                updateRainIntensity(); 
                effectInterval = setInterval(createLightning, 10000); 
            } 
            else if (type === 'sunny') {
                newThemeColor = 'yellow';
                document.body.style.backgroundColor = '#fef08a'; // Vàng rực rỡ
                
                weatherCardIcon = '👒';
                weatherRecommendation = 'Wear a Hat';
                weatherCardBgClass = 'bg-amber-50/95 border-yellow-200';
                
                document.getElementById('sunSliderWrapper').classList.remove('hidden');
                updateSunIntensity();
                effectInterval = setInterval(createSunGlare, 10000); 
            } 
            else if (type === 'cloudy') {
                newThemeColor = 'sky';
                document.body.style.backgroundColor = '#bae6fd'; // Xanh bầu trời
                
                weatherCardIcon = '💙';
                weatherRecommendation = 'Nice Weather';
                weatherCardBgClass = 'bg-sky-50/95 border-sky-200';
                
                document.getElementById('cloudSliderWrapper').classList.remove('hidden');
                updateCloudSpeed();
                effectInterval = setInterval(createCloudFog, 10000); 
            }

            changeSystemTheme(newThemeColor);
            
            // Render lại giao diện card để cập nhật Icon góc trái & Màu nền
            renderView(currentActiveScope); 
        }

        function changeSystemTheme(newColor) {
            const walker = document.createTreeWalker(document.body, NodeFilter.SHOW_ELEMENT, null, false);
            const regex = new RegExp(`(^|\\s|:)(bg|text|border|ring|shadow|from|to|via|accent)-${currentTheme}-`, 'g');
            let node;
            while ((node = walker.nextNode())) {
                if (node.className && typeof node.className === 'string') {
                    node.className = node.className.replace(regex, `$1$2-${newColor}-`);
                }
            }
            currentTheme = newColor;
            
            const popupHeader = document.getElementById('popupHeader');
            popupHeader.className = `absolute top-0 left-0 w-full h-32 bg-gradient-to-br from-${newColor}-600 to-${newColor}-400 -z-10`;
        }

        // --- HIỆU ỨNG MƯA & SẤM SÉT ---
        function updateRainIntensity() {
            const container = document.getElementById('weatherEffectsContainer');
            container.innerHTML = ''; 
            const intensity = document.getElementById('rainIntensitySlider').value;
            const dropCount = intensity * 25; 

            for(let i=0; i<dropCount; i++) {
                let drop = document.createElement('div');
                drop.style.position = 'absolute';
                drop.style.width = '2px';
                drop.style.height = (Math.random() * 25 + 15) + 'px';
                drop.style.background = 'rgba(255, 255, 255, 0.6)';
                drop.style.left = Math.random() * 100 + 'vw';
                drop.style.top = '-20vh';
                let duration = (Math.random() * 0.5 + 0.4) - (intensity * 0.02);
                drop.style.animation = `rainFall ${duration > 0.2 ? duration : 0.2}s linear infinite`;
                drop.style.animationDelay = `${Math.random() * 2}s`;
                container.appendChild(drop);
            }
        }
        function createLightning() {
            const flash = document.createElement('div');
            flash.className = 'lightning-flash';
            document.body.appendChild(flash);
            setTimeout(() => { if(flash) flash.remove(); }, 600);
        }

        // --- HIỆU ỨNG NẮNG & CHÓI LÓA ---
        function updateSunIntensity() {
            const intensity = document.getElementById('sunIntensitySlider').value;
            const overlay = document.getElementById('sunOverlay');
            overlay.style.opacity = (intensity * 0.06).toString();
        }
        function createSunGlare() {
            const glare = document.createElement('div');
            glare.className = 'sun-glare-effect';
            document.body.appendChild(glare);
            setTimeout(() => { if(glare) glare.remove(); }, 2500);
        }

        // --- HIỆU ỨNG MÂY & SƯƠNG MÙ ---
        function updateCloudSpeed() {
            const container = document.getElementById('weatherEffectsContainer');
            const intensity = document.getElementById('cloudSpeedSlider').value;
            
            container.innerHTML = ''; 
            for(let i = 0; i < 7; i++) {
                let cloud = document.createElement('i');
                cloud.className = `fas fa-cloud absolute text-white drop-shadow-md`;
                cloud.style.fontSize = (Math.random() * 4 + 4) + 'rem'; 
                cloud.style.top = (Math.random() * 35 + 5) + 'vh'; 
                cloud.style.left = '-20vw';
                cloud.style.opacity = '0';
                
                let duration = 50 - (intensity * 4) + Math.random() * 5; 
                cloud.style.animation = `cloudMove ${duration}s linear infinite`;
                cloud.style.animationDelay = `${(i * 3) + Math.random() * 5}s`; 
                container.appendChild(cloud);
            }
        }
        function createCloudFog() {
            const fog = document.createElement('div');
            fog.className = 'cloud-fog-effect';
            document.body.appendChild(fog);
            setTimeout(() => { if(fog) fog.remove(); }, 4000);
        }

        // ==========================================
        // HỆ THỐNG DỮ LIỆU GOOGLE SHEETS
        // ==========================================
        let appData = { news: [], tickers: [], classes: [] };
        let unlockedClasses = new Set();
        let pendingClassSelection = '';
        let pendingClassLabel = '';
        let currentActiveScope = 'General';
        let currentViewMode = 'grid';
        let timerInterval;
        let secondsWaited = 0;
        let isPreviewFullScreen = false;

        function showLoading(message) {
            document.getElementById('loaderText').innerText = message;
            document.getElementById('loaderTimer').innerText = '0';
            document.getElementById('globalLoader').classList.remove('hidden');
            secondsWaited = 0;
            clearInterval(timerInterval);
            timerInterval = setInterval(() => {
                secondsWaited++;
                document.getElementById('loaderTimer').innerText = secondsWaited;
            }, 1000);
        }

        function hideLoading() {
            clearInterval(timerInterval);
            document.getElementById('globalLoader').classList.add('hidden');
        }

        function formatDateCustom(dateString) {
            if (!dateString) return '';
            const d = new Date(dateString);
            if (isNaN(d.getTime())) return dateString;
            const day = String(d.getDate()).padStart(2, '0');
            const months = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
            return `${day}-${months[d.getMonth()]}-${String(d.getFullYear()).slice(-2)}`;
        }

        window.onload = async () => {
            if(!API_URL || API_URL.trim() === '') {
                document.getElementById('newsView').classList.remove('hidden');
                return;
            }
            showLoading("Connecting to database...");
            try {
                const res = await fetch(API_URL, { redirect: "follow" });
                appData = await res.json();
                hideLoading();
                document.getElementById('newsView').classList.remove('hidden');
                initTickers(appData.tickers);
                initCustomDropdown(appData.classes);
                renderView('General');
            } catch (err) {
                hideLoading();
                console.error(err);
                alert("Failed to load live data.");
            }
        };

        function initTickers(tickers) {
            if (!tickers || tickers.length === 0) return;
            document.getElementById('tickerText').innerHTML = tickers.join(" &nbsp;&nbsp;&nbsp;✦&nbsp;&nbsp;&nbsp; ");
        }

        function initCustomDropdown(classes) {
            const menu = document.getElementById('dropdownMenu');
            const studentClassSelector = document.getElementById('studentClass');
            let menuHTML = `<div class="cursor-pointer px-5 py-3 hover:bg-${currentTheme}-50 hover:text-${currentTheme}-600 font-bold text-slate-700 flex items-center transition" onclick="selectClassOption('General', '🌐 School Wide')">🌐 School Wide</div>`;
            classes.forEach(cls => {
                menuHTML += `<div class="cursor-pointer px-5 py-3 hover:bg-${currentTheme}-50 hover:text-${currentTheme}-600 font-bold text-slate-700 flex items-center transition border-t border-slate-50" onclick="selectClassOption('${cls}', '🚀 ${cls}')">🚀 ${cls}</div>`;
                studentClassSelector.innerHTML += `<option value="${cls}">${cls}</option>`;
            });
            menu.innerHTML = menuHTML;
        }

        function toggleDropdown(e) {
            e.stopPropagation();
            document.getElementById('dropdownMenu').classList.toggle('hidden');
        }

        window.addEventListener('click', function(e) {
            const dropdownMenu = document.getElementById('dropdownMenu');
            if (!document.getElementById('customDropdown').contains(e.target) && !dropdownMenu.classList.contains('hidden')) {
                dropdownMenu.classList.add('hidden');
            }
        });

        function selectClassOption(value, label) {
            document.getElementById('dropdownMenu').classList.add('hidden');
            if (value === 'General' || unlockedClasses.has(value)) {
                document.getElementById('dropdownSelected').innerText = label;
                renderView(value);
            } else {
                pendingClassSelection = value; pendingClassLabel = label;
                document.getElementById('targetClassName').innerText = value;
                const passInput = document.getElementById('classPassInput');
                passInput.value = ''; passInput.type = 'password';
                document.getElementById('passError').classList.add('hidden');
                document.getElementById('passwordModal').classList.remove('hidden');
                setTimeout(() => passInput.focus(), 100);
            }
        }

        function togglePassVisibility() {
            const passInput = document.getElementById('classPassInput');
            const eyeIcon = document.getElementById('eyeIcon');
            if (passInput.type === 'password') {
                passInput.type = 'text'; eyeIcon.className = 'fas fa-eye-slash text-lg';
            } else {
                passInput.type = 'password'; eyeIcon.className = 'fas fa-eye text-lg';
            }
        }

        async function submitPassword() {
            const pass = document.getElementById('classPassInput').value;
            if (!pass) return;
            document.getElementById('passwordModal').classList.add('hidden');
            showLoading(`Verifying passcode...`);
            try {
                const res = await fetch(API_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain' }, redirect: 'follow', body: JSON.stringify({ action: 'verifyPassword', className: pendingClassSelection, password: pass }) });
                const result = await res.json();
                hideLoading();
                if (result.status === 'success') {
                    unlockedClasses.add(pendingClassSelection);
                    document.getElementById('dropdownSelected').innerText = pendingClassLabel;
                    renderView(pendingClassSelection);
                } else {
                    document.getElementById('passwordModal').classList.remove('hidden');
                    document.getElementById('passError').classList.remove('hidden');
                }
            } catch (e) {
                hideLoading();
                document.getElementById('passwordModal').classList.remove('hidden');
            }
        }

        function logoutClass() {
            if (currentActiveScope !== 'General') unlockedClasses.delete(currentActiveScope); 
            selectClassOption('General', '🌐 School Wide');
        }

        function setViewMode(mode) {
            currentViewMode = mode;
            const btnGrid = document.getElementById('btnGrid'), btnList = document.getElementById('btnList');
            if (mode === 'grid') {
                btnGrid.className = `px-3.5 py-1.5 rounded-lg bg-white text-${currentTheme}-600 shadow-sm font-medium transition theme-transition-text`;
                btnList.className = `px-3.5 py-1.5 rounded-lg text-slate-500 hover:text-slate-800 hover:bg-slate-200/50 font-medium transition`;
            } else {
                btnList.className = `px-3.5 py-1.5 rounded-lg bg-white text-${currentTheme}-600 shadow-sm font-medium transition theme-transition-text`;
                btnGrid.className = `px-3.5 py-1.5 rounded-lg text-slate-500 hover:text-slate-800 hover:bg-slate-200/50 font-medium transition`;
            }
            renderView(currentActiveScope);
        }

        function renderView(scope) {
            showView('home');
            currentActiveScope = scope;
            const isHome = scope === 'General';
            
            document.getElementById('sectionTitle').innerHTML = isHome 
                ? `<div class="flex items-center space-x-3"><div class="w-10 h-10 rounded-full bg-${currentTheme}-100 text-${currentTheme}-600 flex items-center justify-center text-xl theme-transition"><i class="fas fa-desktop"></i></div><span>Computing</span></div>` 
                : `<span class="mr-3">🚀</span> ${scope} Updates`;

            if (isHome) document.getElementById('logoutClassBtn').classList.add('hidden');
            else document.getElementById('logoutClassBtn').classList.remove('hidden');

            const isTrending = (item) => String(item.Category).trim().toUpperCase() === 'TRENDING';
            const isIgsce = (item) => String(item.Category).trim().toUpperCase() === 'IGSCE' || String(item.Category).trim().toUpperCase() === 'IGCSE';

            if (isHome) {
                document.getElementById('hotNewsSection').classList.remove('hidden');
                document.getElementById('igsceNewsSection').classList.remove('hidden');
                renderCardList(appData.news.filter(x => isTrending(x) && x.Class === 'General'), 'hotNewsContainer', true, 2);
                renderCardList(appData.news.filter(x => isIgsce(x) && x.Class === 'General'), 'igsceNewsContainer', false, 6);
            } else {
                document.getElementById('hotNewsSection').classList.add('hidden');
                document.getElementById('igsceNewsSection').classList.add('hidden');
            }

            const classFeed = appData.news.filter(x => !isTrending(x) && !isIgsce(x) && x.Class === scope); 
            renderCardList(classFeed, 'newsContainer', false, 6);
        }

        function renderCardList(items, containerId, isHot, limit) {
            const container = document.getElementById(containerId);
            container.innerHTML = '';
            
            if (!isHot && (containerId === 'newsContainer' || containerId === 'igsceNewsContainer')) {
                container.className = currentViewMode === 'list' ? 'flex flex-col gap-6 sm:gap-8' : 'grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6 sm:gap-8';
            }

            if (!isHot && items.length === 0 && containerId === 'newsContainer') {
                document.getElementById('noNewsMsg').classList.remove('hidden');
                return;
            }
            if(containerId === 'newsContainer') document.getElementById('noNewsMsg').classList.add('hidden');

            const sortedItems = items.slice().map((item, index) => ({...item, originalIndex: index})).sort((a, b) => {
                const prioA = parseInt(a.Priority) || 0; const prioB = parseInt(b.Priority) || 0;
                return prioB !== prioA ? prioB - prioA : b.originalIndex - a.originalIndex;
            }).slice(0, limit);

            if (containerId === 'igsceNewsContainer' && sortedItems.length === 0) document.getElementById('igsceNewsSection').classList.add('hidden');

            sortedItems.forEach(item => {
                const isList = (!isHot && currentViewMode === 'list');
                
                // Card Styling
                const cardWrapperClass = `${weatherCardBgClass} rounded-3xl overflow-hidden card-modern flex ${isList ? 'flex-col sm:flex-row' : 'flex-col'} h-full border relative`;
                
                // WEATHER FORECAST BADGE: Nằm gọn gàng góc trên bên trái khung ảnh, nền trắng tinh, không mờ nhòe.
                const decorationIcon = weatherCardIcon ? `
                    <div class="absolute top-3 left-3 z-30 bg-white rounded-xl px-3 py-1.5 shadow-[0_4px_15px_rgba(0,0,0,0.1)] border border-slate-100 flex items-center space-x-2">
                        <span class="text-2xl drop-shadow-sm leading-none">${weatherCardIcon}</span>
                        <div class="flex flex-col">
                            <span class="text-[9px] text-slate-400 font-bold uppercase tracking-wider leading-none mb-0.5">Forecast</span>
                            <span class="text-xs text-slate-800 font-extrabold leading-none">${weatherRecommendation}</span>
                        </div>
                    </div>
                ` : '';

                const mediaWrapperClass = isList ? 'relative w-full sm:w-2/5 lg:w-1/3 shrink-0 min-h-[14rem]' : 'relative';
                const contentWrapperClass = isList ? 'p-5 sm:p-7 flex-grow flex flex-col justify-center' : 'p-5 sm:p-7 flex-grow flex flex-col';
                
                let btnClass = `inline-flex items-center justify-center w-full ${isList ? 'sm:w-max sm:px-6' : ''} bg-white/60 hover:bg-white text-slate-800 font-bold py-3 rounded-xl transition text-sm mt-auto shadow-sm`;

                const card = `
                    <div class="${cardWrapperClass}">
                        ${item.Priority >= 80 && !isHot ? '<div class="absolute top-4 right-4 bg-yellow-400 text-yellow-900 text-xs font-extrabold px-3 py-1.5 rounded-full z-10 shadow-md animate-pulse"><i class="fas fa-thumbtack mr-1"></i> PINNED</div>' : ''}
                        
                        <div class="${mediaWrapperClass}">
                            ${decorationIcon}
                            ${generateMediaEmbed(item.MediaType, item.MediaURL, isHot, isList)}
                        </div>
                        
                        <div class="${contentWrapperClass}">
                            <div class="flex justify-between items-center mb-4 pl-4 sm:pl-0">
                                <span class="px-3 py-1 text-xs font-bold rounded-lg border bg-white/80 text-slate-700">${item.Class}</span>
                                <span class="text-xs text-slate-500 font-bold tracking-wide"><i class="far fa-calendar-alt mr-1"></i> ${formatDateCustom(item.Date)}</span>
                            </div>
                            <h3 class="text-lg sm:text-xl font-bold text-slate-900 mb-3 leading-snug">${item.Title}</h3>
                            <p class="text-slate-600 text-sm font-medium mb-5 flex-grow line-clamp-3">${item.Description}</p>
                            ${item.Link ? `<a href="${item.Link}" target="_blank" class="${btnClass}">Read Full Post <i class="fas fa-arrow-right ml-2 text-xs"></i></a>` : ''}
                        </div>
                    </div>
                `;
                container.innerHTML += card;
            });
        }

        function generateMediaEmbed(type, url, isHot, isList = false) {
            let heightClass = isHot ? 'h-64 sm:h-72' : 'h-48 sm:h-56';
            let mediaStyle = isList ? `w-full h-56 sm:absolute sm:inset-0 sm:h-full object-cover` : `w-full object-cover ${heightClass}`;
            type = String(type).toLowerCase().trim();
            if (type === 'youtube') {
                const ytId = url.match(/(?:youtu\.be\/|youtube\.com\/(?:embed\/|v\/|watch\?v=|watch\?.+&v=))([\w-]{11})/)?.[1];
                if (ytId) return `<iframe class="${mediaStyle}" src="https://www.youtube.com/embed/${ytId}" frameborder="0" allowfullscreen></iframe>`;
            } 
            if (type === 'tiktok') {
                const ttId = url.match(/\/video\/(\d+)/)?.[1];
                if (ttId) return `<iframe class="${mediaStyle}" src="https://www.tiktok.com/embed/v2/${ttId}" frameborder="0"></iframe>`;
            }
            return `<img src="${url || 'https://images.unsplash.com/photo-1546410531-bb4caa6b424d?w=500'}" class="${mediaStyle}">`;
        }

        function showView(v) {
            document.getElementById('newsView').classList.add('hidden'); document.getElementById('submitView').classList.add('hidden');
            if(v === 'home') document.getElementById('newsView').classList.remove('hidden');
            if(v === 'submit') document.getElementById('submitView').classList.remove('hidden');
            window.scrollTo(0,0);
        }

        function handlePreview(e) {
            e.preventDefault();
            const name = document.getElementById('studentName').value;
            document.getElementById('prevAvatar').innerText = name.charAt(0).toUpperCase();
            document.getElementById('prevName').innerText = name;
            document.getElementById('prevContent').innerText = document.getElementById('newsContent').value;
            document.getElementById('previewModal').classList.remove('hidden');
        }

        function toggleFullScreenPreview() {
            const box = document.getElementById('previewBox'), area = document.getElementById('previewContentArea'), icon = document.getElementById('fullScreenBtn').querySelector('i');
            isPreviewFullScreen = !isPreviewFullScreen;
            if (isPreviewFullScreen) {
                box.classList.remove('max-w-lg', 'sm:rounded-3xl', 'sm:max-h-[95vh]'); box.classList.add('max-w-full', 'w-full', 'h-full', 'rounded-none');
                area.classList.remove('max-h-[45vh]'); area.classList.add('flex-grow'); 
                icon.className = 'fas fa-compress text-lg';
            } else {
                box.classList.remove('max-w-full', 'w-full', 'h-full', 'rounded-none'); box.classList.add('max-w-lg', 'sm:rounded-3xl', 'sm:max-h-[95vh]');
                area.classList.remove('flex-grow'); area.classList.add('max-h-[45vh]');
                icon.className = 'fas fa-expand text-lg';
            }
        }

        function closePreview() {
            document.getElementById('previewModal').classList.add('hidden');
            const btn = document.getElementById('finalSubmitBtn');
            document.getElementById('confirmRules').checked = false;
            btn.disabled = true; btn.classList.add('opacity-50', 'cursor-not-allowed');
            if (isPreviewFullScreen) toggleFullScreenPreview();
        }

        document.getElementById('confirmRules').addEventListener('change', function() {
            const btn = document.getElementById('finalSubmitBtn');
            btn.disabled = !this.checked; btn.classList.toggle('opacity-50', !this.checked); btn.classList.toggle('cursor-not-allowed', !this.checked);
        });

        async function submitData() {
            closePreview(); showLoading("Submitting your story...");
            const payload = { action: 'submitNews', studentName: document.getElementById('studentName').value, studentClass: document.getElementById('studentClass').value, newsContent: document.getElementById('newsContent').value };
            try {
                await fetch(API_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain' }, redirect: 'follow', body: JSON.stringify(payload) });
                hideLoading(); document.getElementById('newsForm').reset(); alert('Success! Your story has been sent.');
                selectClassOption('General', '🌐 School Wide');
            } catch (err) {
                hideLoading(); alert('Failed to submit.');
            }
        }
    </script>
</body>
</html>
